name: ci

on:
  push: { branches: [main] }
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: Control API (biome, strict TypeScript, vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: pnpm, at the version package.json pins
        run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec biome check .
      - run: pnpm exec tsc --noEmit
      - run: pnpm exec vitest run

  shell:
    name: Scripts (shellcheck, bats against a real nginx and PostgreSQL, alert rules)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: make env
      - name: shellcheck on every script
        run: make lint-sh
      - name: bats (every gate, in both directions)
        run: make test-ops
      - name: promtool (the five rules, when each fires and when it stays quiet)
        run: make test-rules

  iac:
    name: Terraform and Helm (validated, never applied)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: make validate-iac

  sabotage:
    name: Every gate is watched (mutation check)
    needs: [api, shell]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: make sabotage

  stack:
    name: Stack (docker compose, black-box smoke test, recorded tour)
    needs: [api, shell]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: make env
      - name: make env is idempotent (a second run must not rotate the database password)
        run: |
          cp .env "$RUNNER_TEMP/env.first"
          make env
          cmp .env "$RUNNER_TEMP/env.first"
      - name: make up (builds the image, starts PostgreSQL and Prometheus, ships the first release)
        run: make up
      - run: scripts/smoke.sh http://localhost:8100
      - name: The recorded tour on the page still matches what the stack answers
        run: node scripts/record-transcripts.mjs --check
      - name: Stop and start again on the same volumes (the releases and the database must still be there)
        run: |
          make down
          make up
          scripts/smoke.sh http://localhost:8100
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200
      - run: docker compose down -v

  browser:
    name: Browser (landing, lab, 14 languages; Playwright + axe)
    needs: [api, shell]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # The same command a reviewer runs locally: builds the container with the lab on and drives it with Playwright.
      - name: make e2e
        run: make e2e
        env:
          CI: "true"
      - name: Test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with: { name: browser-test-results, path: e2e/test-results, if-no-files-found: ignore }
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200
      - run: docker compose down -v

  security:
    name: Security (secrets, Dockerfile, workflows)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      # The binary, pinned and checksum-verified, instead of gitleaks-action: the action scans "<first commit>^..HEAD",
      # and the first commit of a new repository has no parent, so it fails on the very first push.
      - name: Install gitleaks (pinned, checksum verified)
        run: |
          v=8.24.3
          base=https://github.com/gitleaks/gitleaks/releases/download/v$v
          archive=gitleaks_${v}_linux_x64.tar.gz # keep the release's file name: the checksum list refers to it
          curl -sSfLO "$base/$archive"
          curl -sSfLO "$base/gitleaks_${v}_checksums.txt"
          sha256sum --check --ignore-missing "gitleaks_${v}_checksums.txt" | grep -F "$archive: OK"
          tar xzf "$archive" gitleaks
      - name: Secret scan (full history)
        run: ./gitleaks git --no-banner --redact -v .
      - name: Lint the Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with: { dockerfile: Dockerfile, failure-threshold: warning }
      - name: Lint the workflows
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color
