name: groundwork

services:
  host:
    build:
      context: .
      target: runtime
    image: groundwork-devops:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:${GW_PORT:-8100}:8080"
    environment:
      DATABASE_URL: "postgres://groundwork:${POSTGRES_PASSWORD:?run make env, or copy .env.example to .env}@db:5432/groundwork"
      GW_LAB: "1"
      GW_ENV: development
      GW_PROMETHEUS_URL: http://prometheus:9090
      # Prometheus reaches the edge by this service's name, so that is the Host header the control API sees from it.
      # Without it the guard answers 403 and the "control" scrape target is permanently down.
      GW_ALLOWED_HOSTS: host
      NODE_ENV: development
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - gwdata:/srv/groundwork
    # A server whose root filesystem cannot be written is a server that cannot be quietly changed by hand.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  # Scrapes the sample service and the delivery machinery through the edge, and evaluates the alert rules in prometheus/rules.yml.
  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=1h
      - --web.listen-address=:9090
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules.yml:/etc/prometheus/rules.yml:ro
    depends_on:
      host:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/ready"]
      interval: 3s
      timeout: 3s
      retries: 20

  db:
    image: postgres:15-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: groundwork
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run make env, or copy .env.example to .env}
      POSTGRES_DB: groundwork
    volumes:
      - dbdata:/var/lib/postgresql/data
      - ./db/seed.sql:/docker-entrypoint-initdb.d/10-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U groundwork -d groundwork"]
      interval: 3s
      timeout: 3s
      retries: 20

  # The shell tests, run against the same image and the same database server, in their own databases.
  ops-test:
    profiles: ["test"]
    build:
      context: .
      target: ops-test
    image: groundwork-ops-test:local
    environment:
      GW_TEST_ADMIN_URL: "postgres://groundwork:${POSTGRES_PASSWORD:?run make env, or copy .env.example to .env}@db:5432/groundwork"
    depends_on:
      db:
        condition: service_healthy

  # Browser tests (Playwright + axe). They share the network of the server container, so the edge is plain localhost:8080
  # (a secure origin, which the clipboard and service workers need) without any browser flag.
  e2e:
    profiles: [e2e]
    image: mcr.microsoft.com/playwright:v1.49.1-jammy
    network_mode: "service:host"
    working_dir: /work/e2e
    volumes:
      - ./e2e:/work/e2e
      - ./docs/img:/work/docs/img
    environment:
      E2E_BASE_URL: http://localhost:8080
      CI: "1"
    depends_on:
      host: { condition: service_healthy }
    command: ["bash", "-lc", "npm ci --no-audit --no-fund && npx tsc --noEmit && npx playwright test"]

volumes:
  gwdata:
  dbdata:
