{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "groundwork.name" . }}
  labels:
    {{- include "groundwork.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "groundwork.selector" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressNamespace }}
      ports:
        - port: http
{{- end }}
