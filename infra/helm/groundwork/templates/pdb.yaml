apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "groundwork.name" . }}
  labels:
    {{- include "groundwork.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "groundwork.selector" . | nindent 6 }}
