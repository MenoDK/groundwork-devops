apiVersion: v1
kind: Service
metadata:
  name: {{ include "groundwork.name" . }}
  labels:
    {{- include "groundwork.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "groundwork.selector" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
